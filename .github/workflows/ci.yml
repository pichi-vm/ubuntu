name: CI

on:
  # Pull request branches are checked through pull_request, so each update
  # gets one run.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same pull request or branch cancels the older run.
# Each run on main gets its own group, so runs on main are never
# cancelled or dropped while waiting.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

defaults:
  run:
    shell: bash

permissions:
  contents: read

env:
  RELEASE: "26.04"

jobs:
  commit-messages:
    name: Commit messages
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 🔎 Check commit messages
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            commits="$PR_BASE..$PR_HEAD"
          elif [ "$GITHUB_EVENT_NAME" = push ] && [ "$PUSH_BEFORE" != 0000000000000000000000000000000000000000 ]; then
            commits="$PUSH_BEFORE..$GITHUB_SHA"
          else
            commits="$GITHUB_SHA^!"
          fi
          pipx run gitlint --commits "$commits"

  build:
    name: Build (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: avrea-ubuntu-latest-arm-4-vcpu
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: ⚙️ Prepare build host
        run: |
          sudo chmod a+rw /dev/kvm
          sudo sysctl -w vm.nr_hugepages=4096
          test -r /dev/kvm && test -w /dev/kvm
          test "$(cat /proc/sys/vm/nr_hugepages)" -ge 4096

      - name: 📦 Install Pichi
        run: |
          sudo add-apt-repository --yes ppa:nmccallum/pichi
          sudo apt-get install -y pichi

      - name: 🔨 Build and save Ubuntu
        env:
          XDG_DATA_HOME: ${{ runner.temp }}/ubuntu-image-cache
        run: |
          if ! pichi pull "ghcr.io/pichi-vm/ubuntu:bootstrap-qualification-20261108"; then
            sudo apt-get install -y mmdebstrap ubuntu-keyring e2fsprogs
            bootstrap=$(mktemp -d "$RUNNER_TEMP/bootstrap.XXXXXX")
            trap 'sudo rm -rf "$bootstrap"' EXIT
            case "${{ matrix.arch }}" in
              amd64) mirror=http://archive.ubuntu.com/ubuntu ;;
              arm64) mirror=http://ports.ubuntu.com/ubuntu-ports ;;
            esac
            sudo mmdebstrap --mode=root --variant=minbase \
              --include=mmdebstrap,ca-certificates resolute "$bootstrap/root" \
              "deb $mirror resolute main universe" \
              "deb $mirror resolute-updates main universe" \
              "deb $mirror resolute-security main universe"
            sudo mkfs.ext4 -F -E lazy_itable_init=0 \
              -d "$bootstrap/root" "$bootstrap/bootstrap.raw" 1G
            pichi import raw "$bootstrap/bootstrap.raw" --arch "${{ matrix.arch }}" \
              -t "ghcr.io/pichi-vm/ubuntu:$RELEASE"
          fi

          pichi build . --ref HEAD --memory 8192 \
            -t "ghcr.io/pichi-vm/ubuntu:$RELEASE"

          pichi save "ghcr.io/pichi-vm/ubuntu:$RELEASE" -o "oci-${{ matrix.arch }}"

          pichi inspect ghcr.io/pichi-vm/pichi-build:latest
          pichi inspect "ghcr.io/pichi-vm/ubuntu:$RELEASE" | tee cold-image.json |
            jq -e '.manifest.annotations["dev.pichi.build.bootstrapped"] == "true"'
          cat cold-image.json
          status=0
          timeout --signal=INT --kill-after=10s 60s \
            pichi run "ghcr.io/pichi-vm/ubuntu:$RELEASE" > cold-boot.log 2>&1 || status=$?
          cat cold-boot.log
          pichi stop --time 0 "$(head -n 1 cold-boot.log)"
          test "$status" -eq 124
          grep -q ' login:' cold-boot.log

      - name: ⬆️ Upload image
        uses: actions/upload-artifact@v4
        with:
          name: oci-${{ matrix.arch }}
          path: oci-${{ matrix.arch }}

  publish:
    name: Publish
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [commit-messages, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: 📦 Install Pichi
        run: |
          sudo add-apt-repository --yes ppa:nmccallum/pichi
          sudo apt-get install -y pichi

      - name: ⬇️ Download images
        uses: actions/download-artifact@v4
        with:
          pattern: oci-*

      - name: 🔑 Authenticate to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p "$HOME/.docker"
          printf '{"auths":{"ghcr.io":{"auth":"%s"}}}' \
            "$(printf '%s:%s' "$GITHUB_ACTOR" "$GHCR_TOKEN" | base64 -w0)" \
            > "$HOME/.docker/config.json"

      - name: 🚀 Publish image
        run: |
          pichi load "oci-amd64" --tag "ubuntu:${RELEASE}-amd64"
          pichi load "oci-arm64" --tag "ubuntu:${RELEASE}-arm64"
          list="ubuntu:${RELEASE}"
          pichi manifest create "$list" "${list}-amd64" "${list}-arm64" \
            -a "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            -a "org.opencontainers.image.revision=$GITHUB_SHA" \
            -a "org.opencontainers.image.version=${RELEASE}" \
            -a "org.opencontainers.image.title=Ubuntu ${RELEASE}" \
            -a "org.opencontainers.image.description=Ubuntu ${RELEASE} base OS carapace for pichi"
          # Pichi requires explicit VM platform annotations on both entries.
          pichi manifest annotate "$list" "${list}-amd64" --os pichi --arch amd64
          pichi manifest annotate "$list" "${list}-arm64" --os pichi --arch arm64
          pichi manifest push "$list" "ghcr.io/pichi-vm/ubuntu:$RELEASE"
